map ctrl+shift+n new_os_window_with_cwd
map cmd+enter launch --cwd=current
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+y kitten hints --program @
map ctrl+shift+alt+a launch --stdin-source=@last_cmd_output --type=clipboard
map ctrl+shift+d detach_window ask

map ctrl+alt+q close_shared_ssh_connections

allow_remote_control yes

cursor_trail 3

globinclude platform.conf
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

background_blur 25
background_opacity 0.8

# Maple Mono, rather than Maple Mono NF because https://sw.kovidgoyal.net/kitty/faq/#kitty-is-not-able-to-use-my-favorite-font
# > There is no need, kitty has a builtin NERD font
# BEGIN_KITTY_FONTS
font_family      family="Maple Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
